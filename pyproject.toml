[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-threatmodeler"
version = "0.1.0"
description = "Agent-driven architecture threat modeling CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "cybergeek" }]
dependencies = [
  "openai>=1.40,<2",
  "github-copilot-sdk>=1.0,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12.3,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
threatmodeler = "threatmodeler.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["threatmodeler"]

[tool.pytest.ini_options]
addopts = [
  "-v",
  "--strict-config",
  "--strict-markers",
  "--cov=threatmodeler",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=100",
]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "unit: isolated tests using standard mocks, patches, and in-memory contracts",
  "integration: local-file workflows composed from production adapters and mocked providers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["threatmodeler", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "D"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
files = ["threatmodeler", "tests"]
exclude = "(?x)(^|[\\/])(\\.venv|venv|build|dist|\\.mypy_cache)([\\/]|$)"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
branch = true
source = ["threatmodeler"]
omit = [
  "threatmodeler/contracts/*",
  "threatmodeler/config/*",
  "threatmodeler/errors/*",
  "threatmodeler/logging_config/*",
  "threatmodeler/cli/error_handler.py",
]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.xml]
output = "coverage.xml"
